# Manual TradingView screen that produces the exported list.
# Used by --compare only: this is NOT a strategy rule (see config.yaml).
#
# Each criterion: column (internal name from tradingview_fields), operator (>, >=, <, <=), threshold.
# - currency / convert_to: amount expressed in the currency of the `currency` column, converted
#   with the day's exchange rates (never TradingView's global endpoint);
# - reference: the threshold is a percentage of this column (price >= 100% of the EMA).
# Same values as the manual screen: $150M < market cap < $10B; P/E <= 12; ROE > 10%;
# 5-year revenue CAGR > 5%; net debt/EBITDA TTM (TradingView field) < 3; 6-month performance > 0%;
# price >= EMA 100; country filter (the markets of the universe).
criteria:
  - label: "market cap > $150M"
    column: market_cap
    currency: reporting_currency
    convert_to: USD
    operator: ">"
    threshold: 150000000
  - label: "market cap < $10B"
    column: market_cap
    currency: reporting_currency
    convert_to: USD
    operator: "<"
    threshold: 10000000000
  - label: "P/E <= 12"
    column: pe_ttm
    operator: "<="
    threshold: 12
  - label: "ROE > 10%"
    column: roe_ttm
    operator: ">"
    threshold: 10
  - label: "5-year revenue CAGR > 5%"
    column: revenue_cagr_5y
    operator: ">"
    threshold: 5
  - label: "TradingView net debt/EBITDA < 3"
    column: net_debt_ebitda_tv
    operator: "<"
    threshold: 3
  - label: "6-month performance > 0%"
    column: perf_6m
    operator: ">"
    threshold: 0
  - label: "price >= EMA 100"
    column: price
    reference: ema
    operator: ">="
    threshold: 100
