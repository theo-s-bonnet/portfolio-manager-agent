# Higgons strategy: thresholds, weights and field names.
# Units are in the key names. Operators (<=, <, >) are fixed by each rule in the code;
# thresholds always live here. Any change increments config_version.
strategy: higgons
strategy_version: "2.0"         # version of the written rule set
config_version: "2.0.0"         # incremented on every change to this file

universe:
  markets: [america, canada,                                  # EU + EEA + United Kingdom + Switzerland
            austria, belgium, bulgaria, croatia, cyprus, czech, denmark, estonia,
            finland, france, germany, greece, hungary, iceland, ireland, italy,
            latvia, lithuania, luxembourg, netherlands, norway, poland, portugal,
            romania, slovakia, slovenia, spain, sweden, switzerland, uk]
  excluded_exchanges: [OTC]
  allowed_types: [stock]                          # funds, ETFs, units, REITs: type fund; depositary receipts: dr
  excluded_typespecs: []                          # on the stock side, TradingView only has common and preferred
  excluded_fund_industries: ["Investment Trusts/Mutual Funds"]
  excluded_bank_insurance_industries:             # brokers and investment banks are kept
    - Major Banks
    - Regional Banks
    - Savings Banks
    - Life/Health Insurance
    - Multi-Line Insurance
    - Property/Casualty Insurance
    - Specialty Insurance
  market_cap_min_eur: 150000000
  market_cap_max_eur: 10000000000
  liquidity_min_eur_per_day: 100000
  price_history_months: 6

filters:
  pe_ttm_max: 12
  roe_ttm_min_pct: 10
  revenue_cagr_5y_min_pct: 5
  net_debt_ebitda_max: 3
  ema_period: 100
  ema_entry_pct: 102                              # entry above the EMA, exit lower: avoids round trips
  perf_6m_min_pct: 0
  debt_to_equity_decrease_min_points: 10
  dilution_annual_max_pct: 5
  dilution_years: 2
  dilution_recent_max_pct: 5

score:
  weights:   {momentum: 0.30, value: 0.25, quality: 0.20, growth: 0.15, balance_sheet: 0.10}
  direction: {momentum: high, value: low, quality: high, growth: high, balance_sheet: low}

tradingview_fields:                               # checked against the scanner (see README)
  type: type
  subtype: typespecs
  primary: is_primary
  exchange: exchange
  country: country
  name: description
  sector: sector
  industry: industry
  currency: currency                              # price currency (GBX in London)
  reporting_currency: fundamental_currency_code   # currency of the amounts (market cap, debt, EBITDA...)
  market_cap: market_cap_basic
  price: close
  avg_volume_3m: average_volume_90d_calc
  pe_ttm: price_earnings_ttm
  eps_ttm: earnings_per_share_diluted_ttm
  roe_ttm: return_on_equity
  revenue_cagr_5y: total_revenue_cagr_5y
  net_debt: net_debt
  ebitda_ttm: ebitda
  net_income_ttm: net_income_ttm
  ema: EMA100
  perf_6m: Perf.6M
  first_bar_time: first_bar_time                  # Unix time of the symbol's first bar (reset by a ticker change)

technical:                                        # data-quality parameters, not strategy rules
  comparison_tolerance: 1.0e-9
  history_start_tolerance_days: 7
  tradingview_limit: 100000

rules:                                            # register read by the report
  R3.1:   {status: implemented}
  R3.2:   {status: implemented}
  R3.3:   {status: implemented, note: "90-day average volume x last price"}
  R3.4:   {status: implemented, note: "SPACs listed as common stock cannot be detected"}
  R3.5:   {status: implemented}
  R3.6:   {status: implemented}
  R4.1:   {status: implemented}
  R4.2:   {status: implemented}
  R4.3:   {status: implemented}
  R4.4:   {status: implemented}
  R4.5:   {status: implemented}
  R4.6:   {status: implemented}
  R4.7:   {status: implemented}
  R4.8:   {status: implemented}
  R4.9:   {status: implemented}
  R4.10a: {status: implemented}
  R4.10b: {status: implemented}
  R4.11:  {status: implemented}
  R4.12:  {status: implemented}
  R1:     {status: not_implemented, version: out_of_scope, reason: "overall allocation, checked manually"}
  R2.4:   {status: not_implemented, version: V3}
  R6:     {status: not_implemented, version: V5, reason: "portfolio construction"}
  R8:     {status: not_implemented, version: V5, reason: "allocation between brokerage accounts"}
  S1-S5:  {status: not_implemented, version: V3, reason: "positions and exit rules (S2 in V6)"}
  R10:    {status: not_implemented, version: V3, reason: "trade journal"}
